<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carro AR - Botão Personalizado</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            background-color: #e0e0e0; 
            /* overflow: hidden; removido para garantir que o layout respire */
        }
        
        model-viewer { 
            width: 100vw; 
            height: 100vh; /* Voltamos ao 100vh padrão */
        }

        /* Escondemos o botão padrão bugado */
        model-viewer::part(default-ar-button) {
            display: none;
        }

        /* O Nosso Novo Botão Personalizado */
        #meuBotaoAR {
            background-color: #e50914; /* Vermelho estilo Netflix */
            color: white;
            border: none;
            border-radius: 25px; /* Bordas arredondadas */
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            position: absolute; /* Para flutuar em cima do carro */
            bottom: 40px; /* Bem longe do fundo do ecrã */
            left: 50%; /* Centraliza horizontalmente */
            transform: translateX(-50%); /* Ajuste fino do centro */
            box-shadow: 0px 4px 10px rgba(0,0,0,0.5);
            cursor: pointer;
            z-index: 10; /* Garante que fica por cima do 3D */
        }

    </style>
</head>
<body>

    <model-viewer id="visualizador"
        src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/ToyCar/glTF-Binary/ToyCar.glb" 
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        camera-controls 
        auto-rotate
        shadow-intensity="1"
        alt="Carro 3D">
        
        <!-- Colocamos o nosso botão personalizado DENTRO da tag do model-viewer com o atributo slot="ar-button" -->
        <button slot="ar-button" id="meuBotaoAR">
            Ativar Realidade Aumentada
        </button>
        
    </model-viewer>

</body>
</html>
