<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carro em Realidade Aumentada</title>
    <!-- Importar a ferramenta oficial da Google para AR -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            background-color: #222; 
        }
        /* Faz o visualizador ocupar o ecrã inteiro */
        model-viewer { 
            width: 100vw; 
            height: 100vh; 
        }
    </style>
</head>
<body>

    <!-- O componente que faz tudo: carrega o carro, cria as sombras e ativa o AR -->
    <model-viewer 
        src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/Buggy/glTF/Buggy.gltf" 
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        camera-controls 
        auto-rotate
        shadow-intensity="1"
        alt="Um modelo 3D de um carro em AR">
    </model-viewer>

</body>
</html>
