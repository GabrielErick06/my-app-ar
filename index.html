<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carro AR - Correção</title>
    
    <!-- Biblioteca Model Viewer (Versão Atualizada) -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            /* Mudei o fundo para um cinza claro para destacar o carro */
            background-color: #e0e0e0; 
        }
        model-viewer { 
            width: 100vw; 
            height: 100vh; 
        }
    </style>
</head>
<body>

    <!-- Usando arquivo .glb que não precisa de arquivos externos -->
    <model-viewer 
        src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/ToyCar/glTF-Binary/ToyCar.glb" 
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        camera-controls 
        auto-rotate
        shadow-intensity="1"
        alt="Carro 3D">
    </model-viewer>

</body>
</html>
